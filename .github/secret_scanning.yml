# Paths GitHub secret scanning should not alert on.
#
# Only test fixtures belong here, and only files whose entire purpose is to
# contain credential-shaped strings. The redaction engine cannot be tested
# without inputs that look exactly like the things it removes.
#
# This is the second line of defence, not the first. The fixtures themselves are
# assembled from fragments so no contiguous credential-shaped literal exists in
# the source at all — see the comment in internal/redact/redact_test.go. That
# protects forks, contributors' local scanners, and anyone grepping the tree,
# none of which read this file.
#
# Adding a path here is a claim that nothing in it is ever a real secret. Do not
# add application code, configuration, or documentation.

paths-ignore:
  - "internal/redact/redact_test.go"
  - "internal/connect/writers_test.go"
