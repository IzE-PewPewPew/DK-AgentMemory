<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>DevKuong Memories</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #fbfbfa; --panel: #fff; --line: #e4e4e2; --ink: #1a1a19;
    --muted: #6b6b66; --accent: #2f6f4e; --warn: #9a4b23;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16171a; --panel: #1d1f23; --line: #2e3138; --ink: #e8e8e6;
      --muted: #9a9a94; --accent: #7fc39b; --warn: #e0a06a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  header {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 14px 20px; border-bottom: 1px solid var(--line); background: var(--panel);
    position: sticky; top: 0; z-index: 5;
  }
  h1 { font-size: 15px; margin: 0; font-weight: 620; letter-spacing: -0.01em; }
  .ro {
    font-size: 11px; text-transform: uppercase; letter-spacing: .07em;
    color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 2px 9px;
  }
  .spacer { flex: 1 }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); display: inline-block; }
  .dot.live { background: var(--accent); }
  .dot.down { background: var(--warn); }
  main { max-width: 1080px; margin: 0 auto; padding: 20px; }
  nav { display: flex; gap: 4px; margin-bottom: 16px; flex-wrap: wrap; }
  button {
    font: inherit; color: var(--ink); background: var(--panel);
    border: 1px solid var(--line); border-radius: 7px; padding: 6px 13px; cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  button[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: var(--bg); }
  input {
    font: inherit; color: var(--ink); background: var(--panel);
    border: 1px solid var(--line); border-radius: 7px; padding: 7px 11px; min-width: 240px;
  }
  input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .row { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 13px 15px; margin-bottom: 9px;
  }
  .card h3 { margin: 0 0 5px; font-size: 14.5px; font-weight: 600; }
  .card p { margin: 0; color: var(--muted); white-space: pre-wrap; overflow-wrap: anywhere; }
  .meta { display: flex; gap: 7px; flex-wrap: wrap; margin-top: 9px; font-size: 12px; color: var(--muted); }
  .tag { border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; font-family: var(--mono); font-size: 11.5px; }
  .tag.lesson { border-color: var(--accent); color: var(--accent); }
  .tag.team { border-color: var(--accent); }
  .empty { color: var(--muted); padding: 32px 0; text-align: center; }
  .dim { color: var(--muted); font-family: var(--mono); font-size: 11.5px; }
  .runbar {
    display: flex; align-items: center; gap: 11px; flex-wrap: wrap;
    border: 1px solid var(--line); border-radius: 9px;
    padding: 9px 13px; margin-bottom: 11px; font-size: 12.5px;
  }
  .runbar .bar { width: 190px; height: 6px; margin: 0; }
  .runbar b { color: var(--ink); font-weight: 600; }
  .runbar.busy { border-color: var(--accent); }
  .gwrap { display: flex; gap: 9px; align-items: flex-start; }
  .gpanel { width: 290px; flex: 0 0 290px; max-height: 560px; overflow-y: auto; }
  .gpanel h3 { overflow-wrap: anywhere; }
  @media (max-width: 900px) { .gwrap { flex-direction: column } .gpanel { width: 100%; flex: 1 } }
  .legend { display: flex; flex-wrap: wrap; gap: 7px; }
  .lg {
    display: inline-flex; align-items: center; gap: 6px;
    border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px;
    font-size: 12px; color: var(--ink); background: none; cursor: pointer;
  }
  .lg.on { border-color: var(--accent); }
  button.link {
    border: none; background: none; color: var(--accent); padding: 0 4px;
    font-size: 12.5px; cursor: pointer;
  }
  .runbar .spin {
    width: 8px; height: 8px; border-radius: 50%; background: var(--accent);
    animation: pulse 1.4s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .25 } }
  textarea, input[type=text], input:not([type]) {
    width: 100%; background: var(--bg); color: var(--ink);
    border: 1px solid var(--line); border-radius: 7px; padding: 8px 11px;
    font: inherit; font-size: 13px;
  }
  textarea { resize: vertical; min-height: 72px; }
  .chks { gap: 14px; flex-wrap: wrap; }
  .chk { display: flex; align-items: center; gap: 5px; font-size: 12.5px; color: var(--muted); cursor: pointer; }
  .promptbox {
    margin: 0; padding: 13px 15px; background: var(--bg);
    border: 1px solid var(--line); border-radius: 8px;
    font-family: var(--mono); font-size: 12.5px; line-height: 1.55;
    white-space: pre-wrap; overflow-wrap: anywhere; max-height: 60vh; overflow-y: auto;
  }
  .bar {
    display: block; width: 84px; height: 5px; border-radius: 3px;
    background: var(--line); overflow: hidden; margin-bottom: 3px;
  }
  .bar span { display: block; height: 100%; background: var(--accent); }
  .err { color: var(--warn); border: 1px solid var(--warn); border-radius: 8px; padding: 11px 14px; margin-bottom: 14px; }
  .stats { display: flex; gap: 18px; flex-wrap: wrap; margin-bottom: 16px; font-size: 13px; color: var(--muted); }
  .stats b { color: var(--ink); font-weight: 600; }
  code { font-family: var(--mono); font-size: 12.5px; }
  select {
    font: inherit; color: var(--ink); background: var(--panel);
    border: 1px solid var(--line); border-radius: 7px; padding: 6px 10px;
  }
  #gsvg { color: var(--muted); background: transparent; }
  /* Node fills are set per folder as an inline attribute, so hover targets the
     circle itself rather than a class that is no longer applied. */
  .gc-mem  { fill: var(--muted); opacity: .65; }
  .gt { font-size: 9.5px; fill: var(--muted); font-family: var(--mono); pointer-events: none; }
  .gn:hover circle { stroke: var(--ink); stroke-width: 2; }
  .gn[data-kind="file"] { cursor: pointer; }
  .gk { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; }
  .gk-file { background: var(--accent); }
  .gk-mem  { background: var(--muted); opacity: .65; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 7px 9px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 500; }
  .scroll { overflow-x: auto; }
</style>
</head>
<body>
<header>
  <h1>DevKuong Memories</h1>
  <span class="ro" title="Runs on this machine. Nothing is sent anywhere else.">local only</span>
  <span class="spacer"></span>
  <span id="live"><span class="dot" id="dot"></span> <span id="livetext">connecting</span></span>
</header>

<main>
  <div id="gate" hidden>
    <div class="card">
      <h3>Paste your API key</h3>
      <p>The key stays in this tab. Closing the tab forgets it.</p>
      <div class="row" style="margin-top:12px">
        <input id="key" type="password" placeholder="pmk_…" autocomplete="off" spellcheck="false">
        <button id="connect">Connect</button>
      </div>
      <div id="gateerr" class="err" style="margin-top:11px" hidden></div>
      <p style="margin-top:13px">No key yet? Run this in a terminal:</p>
      <div class="row" style="margin-top:6px">
        <code id="keycmd" class="promptbox" style="flex:1;padding:8px 11px">dkm admin key issue</code>
        <button id="keycopy">Copy</button>
      </div>
    </div>
  </div>

  <div id="app" hidden>
    <!--
      Projects first, and it is the landing tab. The old landing view listed
      memories, which is the emptiest surface here until consolidation has run
      -- so a database holding 36,000 observations opened on a blank page.
    -->
    <nav>
      <button data-tab="projects" aria-selected="true">Projects</button>
      <button data-tab="knows">Knows</button>
      <button data-tab="graph">Map</button>
      <button data-tab="compose">Compose</button>
      <button data-tab="sessions">Sessions</button>
      <button data-tab="activity">Activity</button>
      <button data-tab="status">Status</button>
    </nav>

    <div id="error" class="err" hidden></div>

    <!--
      The run bar lives here, outside #list, on purpose. Every tab render calls
      render("") which replaces #list wholesale, so anything drawn inside it
      vanishes the moment the user looks at another tab — which is how a paid
      multi-hour drain became invisible while it was still running.
    -->
    <div id="runbar" class="runbar" hidden></div>

    <div id="stats" class="stats"></div>

    <div id="list"></div>
  </div>
</main>

<script>
(function () {
  "use strict";

  // The API is same-origin: the viewer is mounted under the API's own host, so
  // there is no CORS to configure and no second certificate to renew.
  var base = location.pathname.replace(/\/viewer\/?$/, "") || "";
  var key = sessionStorage.getItem("dkm_key") || "";
  var tab = "memories";
  var es = null;

  var el = function (id) { return document.getElementById(id); };
  var esc = function (s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  };

  function api(path, opts) {
    opts = opts || {};
    opts.headers = Object.assign({ "Authorization": "Bearer " + key }, opts.headers || {});
    return fetch(base + path, opts).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (body) {
        if (!r.ok) {
          var msg = body.message || r.statusText;
          if (body.hint) msg += " — " + body.hint;
          throw new Error(msg);
        }
        return body;
      });
    });
  }

  function showError(e) {
    var box = el("error");
    if (!e) { box.hidden = true; return; }
    box.hidden = false;
    box.textContent = e.message || String(e);
  }

  // Thousands separators: 21174 observations should not read as 2117.4.
  function num(n) {
    return String(n == null ? 0 : n).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
  }

  function ago(iso) {
    var s = Math.max(0, (Date.now() - new Date(iso).getTime()) / 1000);
    if (s < 90) return Math.round(s) + "s ago";
    if (s < 5400) return Math.round(s / 60) + "m ago";
    if (s < 172800) return Math.round(s / 3600) + "h ago";
    return Math.round(s / 86400) + "d ago";
  }

  function memoryCard(m) {
    var tags = '<span class="tag ' + esc(m.kind) + '">' + esc(m.kind) + "</span>";
    if (m.visibility === "team") tags += '<span class="tag team">team</span>';
    if (m.project) tags += "<span class=\"tag\">" + esc(m.project) + "</span>";
    if (m.redacted) tags += '<span class="tag">redacted</span>';
    if (typeof m.score === "number") tags += "<span class=\"tag\">score " + m.score.toFixed(4) + "</span>";
    if (m.bm25_rank) tags += "<span class=\"tag\">bm25 #" + m.bm25_rank + "</span>";
    if (m.vector_rank) tags += "<span class=\"tag\">vec #" + m.vector_rank + "</span>";
    (m.files || []).slice(0, 4).forEach(function (f) {
      tags += "<span class=\"tag\">" + esc(f) + "</span>";
    });

    var body = m.body && m.body !== m.title ? "<p>" + esc(m.body) + "</p>" : "";
    return '<div class="card"><h3>' + esc(m.title) + "</h3>" + body +
      '<div class="meta">' + tags +
      "<span>strength " + (m.strength || 0).toFixed(2) + "</span>" +
      "<span>" + esc(ago(m.updated_at || m.created_at)) + "</span>" +
      "</div></div>";
  }

  function render(html) {
    el("list").innerHTML = html || '<div class="empty">Nothing here yet.</div>';
  }

  function loadStats() {
    api("/v1/healthz").then(function (h) {
      var s = h.stats || {};
      el("stats").innerHTML =
        "<span><b>" + num(s.memories || 0) + "</b> memories</span>" +
        "<span><b>" + num(s.sessions || 0) + "</b> sessions</span>" +
        "<span><b>" + num(s.observations || 0) + "</b> observations</span>" +
        "<span><b>" + num(s.memories_embedded || 0) + "</b> embedded</span>" +
        "<span>embedder: <b>" + esc((h.embedder && (h.embedder.detail || (h.embedder.ok ? "ok" : "down"))) || "?") + "</b></span>" +
        "<span>v<b>" + esc(h.version || "?") + "</b></span>";
    }).catch(function () { el("stats").textContent = ""; });

    loadProgress();
  }

  // The run bar answers "did it read my work, how far has it got, and is it
  // still moving" — the question that twice made this tool look broken when it
  // was working.
  //
  // Counted the way the pipeline counts: the denominator is closed sessions,
  // because open ones are never eligible and including them makes a bar that
  // can never fill; the numerator is "has left the queue", because a session
  // skipped for being empty or too large is done, and counting only sessions
  // with summary text made real progress look like no progress.
  //
  // Built once, then updated by textContent on fixed ids. Rebuilding the
  // innerHTML on every poll would blow away a receipt the user is reading and
  // reset the button mid-run.
  var runBarBuilt = false;
  var running = false;

  function buildRunBar() {
    el("runbar").innerHTML =
      '<span id="rbdot"></span>' +
      '<span id="rbstate"></span>' +
      '<span class="bar"><span id="rbfill" style="width:0%"></span></span>' +
      '<span id="rbcounts"></span>' +
      '<button id="rbgo"></button>' +
      '<button id="rball" title="Work through every unread session in one go. Can run for hours.">Read all</button>' +
      '<span id="rbreceipt" class="dim"></span>';
    el("rbgo").addEventListener("click", function () { startRun(false); });
    el("rball").addEventListener("click", function () { startRun(true); });
    runBarBuilt = true;
  }

  function loadProgress() {
    return api("/v1/progress").then(function (p) {
      var bar = el("runbar");
      if (!p.eligible && !p.open) { bar.hidden = true; return; }
      if (!runBarBuilt) buildRunBar();
      bar.hidden = false;

      var behind = Math.max(0, p.eligible - p.read);
      var pct = p.eligible ? Math.round((p.read / p.eligible) * 100) : 0;
      var live = running || p.running;

      el("rbdot").className = live ? "spin" : "";
      el("rbstate").textContent = live
        ? "Reading sessions now. Leave this tab open — closing it stops the run."
        : (behind ? num(behind) + " sessions are stored but not read yet."
                  : "Every closed session has been read.");
      el("rbfill").style.width = pct + "%";

      var counts = num(p.read) + " of " + num(p.eligible) + " sessions read · " +
        num(p.facts) + " facts · " + num(p.lessons) + " lessons";
      if (p.open) counts += " · " + num(p.open) + " sessions still open";
      el("rbcounts").textContent = counts;
      el("rbcounts").title = p.open
        ? "An open session cannot be read yet. It is counted separately so the bar can reach the end."
        : "";

      el("rbgo").textContent = live ? "reading…" : (behind ? "Read 25 now" : "Check again");
      el("rbgo").disabled = live;
      el("rball").disabled = live || !behind;
      el("rball").hidden = !behind;
      bar.className = "runbar" + (live ? " busy" : "");
    }).catch(function () { el("runbar").hidden = true; });
  }

  // Every press produces a receipt. Silence after a paid button is what made a
  // working run indistinguishable from a broken one.
  //
  // Deliberately no Stop button: aborting the request is what orphans the run
  // record, so the most destructive control on the page would be the one that
  // looks safest.
  function startRun(drain) {
    if (running) return;
    running = true;
    var started = Date.now();
    el("rbreceipt").textContent = "";
    loadProgress();

    var poll = setInterval(loadProgress, 5000);

    api("/v1/admin/consolidate", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(drain ? { drain: true } : {})
    }).then(function (res) {
      var r = (res && res.report) || {};
      if (!res.ran) {
        el("rbreceipt").textContent = res.reason || "Reading is switched off.";
      } else if (r.errors && r.errors.length) {
        // The provider's own words. "ran: true" is not success -- every tier
        // can fail and the route still reports it.
        el("rbreceipt").textContent = "Stopped: " + r.errors[0];
      } else if (!r.sessions_summarised && !r.facts_produced && !r.lessons_produced) {
        el("rbreceipt").textContent = "Ran, but there was nothing new to read.";
      } else {
        el("rbreceipt").textContent =
          "Read " + num(r.sessions_summarised || 0) + " sessions, wrote " +
          num(r.facts_produced || 0) + " facts and " + num(r.lessons_produced || 0) +
          " lessons in " + (r.duration || elapsed(started)) + ".";
      }
    }).catch(function (e) {
      el("rbreceipt").textContent = "Stopped: " + e.message;
    }).then(function () {
      running = false;
      clearInterval(poll);
      loadProgress();
      loadStats();
    });
  }

  function elapsed(since) {
    var s = Math.round((Date.now() - since) / 1000);
    if (s < 90) return s + "s";
    return Math.floor(s / 60) + "m " + (s % 60) + "s";
  }

  var views = {
    // One list, not three. Memories, Lessons and Search were three near
    // identical render paths funnelling into the same card, differing only by
    // a filter the API already accepts -- and the search tab threw away the
    // list you were looking at instead of narrowing it.
    knows: function () {
      var kinds = KINDS.filter(function (k) { return knowsState.kind[k]; });
      var q = knowsState.q.trim();

      var body = { limit: 50 };
      if (projectFilter) body.project = projectFilter;

      var req = q
        ? api("/v1/search", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              query: q, limit: 30,
              project: projectFilter || undefined,
              kinds: kinds.length ? kinds : undefined
            })
          }).then(function (d) { return { items: d.results || [], searched: true, vector: d.vector !== false }; })
        : api("/v1/memories?" + new URLSearchParams(withKinds({
            limit: 50, project: projectFilter || ""
          }, kinds))).then(function (d) { return { items: d.memories || [], searched: false }; });

      return Promise.all([req, projectList()]).then(function (r) {
        var res = r[0], projects = r[1];
        var items = res.items;

        var head =
          '<div class="row" style="margin-bottom:9px">' +
          projectSelect() +
          '<input id="kq" placeholder="say it in your own words — this is not keyword search" value="' +
          esc(knowsState.q) + '">' +
          '<button id="kgo">Search</button></div>' +
          '<div class="row chks" style="margin-bottom:11px">' +
          '<span class="dim">show:</span>' +
          KINDS.map(function (k) {
            return '<label class="chk"><input type="checkbox" data-kind="' + k + '"' +
              (knowsState.kind[k] ? " checked" : "") + "> " + k + "</label>";
          }).join("") +
          '<button id="kall" class="link">all</button><button id="knone" class="link">none</button></div>';

        var note = "";
        if (res.searched) {
          note = '<div class="stats"><span>' + num(items.length) + " results · " +
            (res.vector ? "hybrid" : "keyword only (the embedder is not answering)") + "</span></div>";
        }

        var listHTML;
        if (items.length) {
          listHTML = items.map(memoryCard).join("");
        } else if (res.searched) {
          listHTML = '<div class="card"><h3>No match' +
            (projectFilter ? " in " + esc(shortProject(projectFilter)) : "") + "</h3><p>" +
            "There are only " + num(totalMemories) + " memories so far, so most searches find nothing yet.</p></div>";
        } else {
          listHTML = emptyKnows(projects);
        }

        render(head + note + listHTML + backlogFooter());
        wireKnows();
      });
    },

    sessions: function () {
      return api("/v1/sessions?limit=50" + (projectFilter ? "&project=" + encodeURIComponent(projectFilter) : "")).then(function (d) {
        var rows = (d.sessions || []).map(function (s) {
          return "<tr><td><code>" + esc(s.agent || "—") + "</code></td><td>" + esc(s.project || "—") +
            "</td><td>" + esc(ago(s.started_at)) + "</td><td>" + (s.ended_at ? "closed" : "open") +
            "</td><td>" + esc(s.summary || "") + "</td></tr>";
        }).join("");
        render('<div class="row" style="margin-bottom:9px">' + projectSelect() + "</div>" +
          (rows
            ? '<div class="card scroll"><table><thead><tr><th>Agent</th><th>Project</th><th>Started</th><th>State</th><th>Summary</th></tr></thead><tbody>' + rows + "</tbody></table></div>"
            : '<div class="card"><h3>No sessions' +
              (projectFilter ? " in " + esc(shortProject(projectFilter)) : "") + "</h3></div>"));
        wireProjectSelect();
      });
    },
    projects: function () {
      return api("/v1/projects").then(function (d) {
        var list = d.projects || [];
        // Show every tier, not just memories. A freshly imported project has
        // thousands of observations and no memories until consolidation runs;
        // reporting only the last column makes a successful import look empty.
        var rows = list.map(function (p) {
          var pct = p.sessions ? Math.round((p.summarised / p.sessions) * 100) : 0;
          var bar = '<div class="bar"><span style="width:' + pct + '%"></span></div>';
          return "<tr><td><code>" + esc(p.project || "(none)") + "</code></td><td>" +
            num(p.sessions) + "</td><td>" + num(p.observations) + "</td><td>" +
            bar + '<span class="dim">' + num(p.summarised) + " / " + num(p.sessions) +
            "</span></td><td>" + num(p.memories) + "</td><td>" + esc(ago(p.last_seen)) +
            "</td></tr>";
        }).join("");
        if (!rows) { render(""); return; }

        var pending = list.reduce(function (n, p) { return n + (p.sessions - p.summarised); }, 0);
        var note = pending
          ? '<div class="card"><h3>' + num(pending) + ' sessions have not been read yet</h3><p>' +
            'Notes are stored the moment they are imported. They only become memories after ' +
            'the reader has been over them, and that costs tokens, so it does not start on ' +
            'its own. Use the bar at the top of the page, or <code>dkm consolidate --drain</code>.</p></div>'
          : "";
        render(note + '<div class="card scroll"><table><thead><tr><th>Project</th>' +
          "<th>Sessions</th><th>Observations</th><th>Summarised</th><th>Memories</th>" +
          "<th>Last activity</th></tr></thead><tbody>" + rows + "</tbody></table></div>");
      });
    },

    activity: function () {
      return api("/v1/activity").then(function (d) {
        var agents = d.agents || [];
        if (!agents.length) {
          render('<div class="card"><h3>Nothing captured yet</h3><p>' +
            'Only Claude Code captures automatically, through lifecycle hooks. Every other host ' +
            'records a session when the model decides to call a memory tool — in practice, when ' +
            'you say "remember this".</p></div>');
          return;
        }
        var rows = agents.map(function (a) {
          // Zero observations next to a connected agent is information, not a
          // fault: MCP-only hosts genuinely produce none until asked.
          var note = a.observations === 0 ? '<span class="tag">tool-call only</span>' : "";
          return "<tr><td><code>" + esc(a.agent) + "</code> " + note + "</td><td>" + a.sessions +
            "</td><td>" + a.open_sessions + "</td><td>" + a.observations + "</td><td>" + a.memories +
            "</td><td>" + a.summarised + "</td><td>" + (a.last_seen ? esc(ago(a.last_seen)) : "—") + "</td></tr>";
        }).join("");
        render('<div class="card scroll"><table><thead><tr><th>Agent</th><th>Sessions</th>' +
          "<th>Open</th><th>Observations</th><th>Memories</th><th>Summarised</th><th>Last seen</th>" +
          "</tr></thead><tbody>" + rows + "</tbody></table></div>");
      });
    },

    graph: function () {
      // Nodes and edges come from real co-occurrence in the stored corpus:
      // a file node exists because a memory names that file, an edge exists
      // because two files were named together. Nothing here is inferred by a
      // model, so a small corpus draws a small graph — which is the honest
      // answer, and better than a populated-looking picture of relationships
      // nobody can trace back to anything.
      return api("/v1/projects").then(function (pj) {
        var projects = (pj.projects || []).filter(function (p) { return p.project; });
        if (!projects.length) {
          render('<div class="empty">No projects yet.</div>');
          return;
        }
        // Default to the project with the most to draw, not the most recently
        // touched. Landing on an empty graph reads as a broken feature.
        if (!graphProject) {
          graphProject = projects.slice().sort(function (a, b) {
            return (b.graph_nodes || 0) - (a.graph_nodes || 0);
          })[0].project;
        }
        var current = projects.filter(function (p) { return p.project === graphProject; })[0] || {};

        // Count what the graph will actually draw. This used to show memory
        // count, which is zero for any project that has been imported but not
        // consolidated — so every real project read "(0)".
        var opts = projects.map(function (p) {
          return '<option value="' + esc(p.project) + '"' +
            (p.project === graphProject ? " selected" : "") + ">" +
            esc(p.project) + " (" + num(p.graph_nodes || 0) + " files)</option>";
        }).join("");

        // 2000, not 300. The largest project here has 683 files, so a limit of
        // 300 silently hid 56% of it and the page said nothing — the user was
        // looking at less than half his biggest codebase believing it was all
        // of it. The server clamps at 2000, so this asks for everything it
        // will give.
        var params = { project: graphProject, limit: 2000 };
        if (graphSeed) { params.node = graphSeed; params.depth = graphDepth; }

        return api("/v1/graph?" + new URLSearchParams(params)).then(function (g) {
          var focus = graphSeed
            ? '<button id="gclear">Show whole project</button>' +
              '<span class="dim" style="align-self:center">showing only ' +
              esc(shortPath(graphSeed)) + " and what it links to</span>"
            : "";

          var stored = current.graph_nodes || 0;
          var drawn = g.node_count || 0;
          var status = graphSeed
            ? num(drawn) + " files linked to this one"
            : (stored > drawn
              ? "Showing " + num(drawn) + " of " + num(stored) + " files. The least-touched ones are left out."
              : num(drawn) + " files · " + num(g.edge_count) + " links · from " +
                num(current.sessions || 0) + " sessions");

          var head = '<div class="row">' +
            '<select id="gproj">' + opts + "</select>" +
            '<button id="grebuild">Rebuild</button>' + focus +
            '<span id="gstatus" style="align-self:center;color:var(--muted)">' +
            esc(status) + "</span></div>";

          if (!g.node_count) {
            // Say what the corpus actually holds. Sending the user to Learn --
            // which its own copy warns "can run for hours" of LLM spend -- to
            // produce something already sitting in observations was expensive
            // advice for a problem they did not have.
            var have = (current.observations || 0)
              ? num(current.observations) + " observations across " +
                num(current.sessions) + " sessions are stored for this project. " +
                "Press Rebuild to derive the graph from them — it costs nothing and takes about a second."
              : "Nothing has been imported for this project yet.";
            render(head + '<div class="card"><h3>Not drawn yet</h3><p>' + have + "</p></div>");
            wireGraphControls(projects);
            return;
          }

          render(head +
            '<div class="gwrap">' +
            '<div class="card" style="padding:0;overflow:hidden;flex:1;min-width:0">' +
            '<svg id="gsvg" viewBox="0 0 900 560" style="width:100%;height:auto;display:block"></svg>' +
            "</div>" +
            '<div class="card gpanel" id="gdetail"><p class="dim">Click a file to see what you ' +
            "change at the same time.</p></div></div>" +
            '<div id="glegend"></div>' +
            '<div class="stats"><span>Two files are linked if you changed both in the same ' +
            "session, within a few steps of each other. This comes from your real edits, not " +
            "from the import lines in the code.</span></div>");

          drawGraph(g);
          wireGraphControls(projects);
        });
      });
    },

    // Compose: a rough description in, a finished prompt out, grounded in the
    // memories this service already holds for the project.
    compose: function () {
      return api("/v1/projects").then(function (pj) {
        var projects = (pj.projects || []).filter(function (p) { return p.project; });
        var opts = ['<option value="">(no project — no grounding)</option>'].concat(
          projects.map(function (p) {
            return '<option value="' + esc(p.project) + '"' +
              (p.project === composeState.project ? " selected" : "") + ">" +
              esc(p.project) + "</option>";
          })).join("");

        var boxes = COMPOSE_FOCUS.map(function (f) {
          return '<label class="chk"><input type="checkbox" value="' + f.k + '"' +
            (composeState.focus[f.k] ? " checked" : "") + "> " + esc(f.label) + "</label>";
        }).join("");

        render(
          '<div class="card"><h3>Compose a prompt</h3>' +
          "<p>Describe what you want to build, in any English. This writes a finished " +
          "prompt for a coding model, using what has been learned about the project you " +
          "pick — so it carries your own conventions instead of generic advice.</p>" +
          '<textarea id="cptask" rows="4" placeholder="settings page for my launcher where user can change download folder, set max bandwidth, toggle auto update">' +
          esc(composeState.task) + "</textarea>" +
          '<div class="row" style="margin-top:9px">' +
          '<select id="cpproj">' + opts + "</select>" +
          '<input id="cptarget" placeholder="Claude Opus 5" value="' + esc(composeState.target) + '">' +
          "</div>" +
          '<div class="row chks" style="margin-top:9px">' + boxes + "</div>" +
          '<div class="row" style="margin-top:12px">' +
          '<button id="cpgo">Generate prompt</button>' +
          '<button id="cpprev">What would it use?</button>' +
          '<span id="cpstatus" style="align-self:center;color:var(--muted)"></span>' +
          "</div></div>" +
          '<div id="cpout"></div>');

        wireCompose();
      });
    },

    // Status: run history and spend. History, not live state -- the run bar
    // above owns "is it moving right now", because it survives tab switches
    // and this panel does not.
    status: function () {
      return api("/v1/admin/runs").then(function (d) {
        var spend = d.spend_last_30d || {};
        var runs = d.runs || [];
        var tierName = { 1: "reading sessions", 2: "extracting facts", 3: "finding lessons" };

        var body = '<div class="stats"><span>last 30 days: <b>' +
          num(spend.input_tokens || 0) + "</b> tokens in, <b>" +
          num(spend.output_tokens || 0) + "</b> out</span></div>";

        if (!runs.length) {
          body += '<div class="card"><h3>Nothing has run yet</h3><p>' +
            "Use the bar at the top of the page to start reading your sessions.</p></div>";
        } else {
          var rows = runs.map(function (r) {
            return "<tr><td>" + esc((r.started_at || "").slice(0, 16).replace("T", " ")) +
              "</td><td>" + esc(tierName[r.tier] || r.tier) +
              "</td><td>" + esc(r.project ? shortProject(r.project) : "—") +
              "</td><td>" + num(r.items) + "</td><td>" + num(r.produced) + "</td><td>" + num(r.deduped) +
              "</td><td>" + num((r.input_tokens || 0) + (r.output_tokens || 0)) +
              "</td><td>" + (r.error ? '<span style="color:var(--warn)">' + esc(r.error) + "</span>"
                                     : (r.finished_at ? "ok" : '<span class="dim">did not finish</span>')) +
              "</td></tr>";
          }).join("");
          body += '<div class="card scroll"><table><thead><tr><th>When</th><th>What</th>' +
            "<th>Project</th><th>Read</th><th>Wrote</th><th>Merged</th><th>Tokens</th><th>Result</th>" +
            "</tr></thead><tbody>" + rows + "</tbody></table></div>";
        }
        render(body);
      }).catch(function (e) {
        // The runs endpoint is admin-only. A read key should see the reason
        // rather than a bare error.
        render('<div class="card"><h3>Run history needs an admin key</h3><p>' +
          esc(e.message) + "</p></div>");
      });
    }
  };

  var graphProject = "";
  var graphSeed = "";       // when set, show only this file's neighbourhood
  var graphDepth = 2;

  // --- shared list state ----------------------------------------------------

  // The four kinds the store actually accepts. Not derived by subtraction from
  // a total: models.go defines fact, decision, lesson and preference, so
  // "everything that is not a lesson" is two kinds, not one.
  var KINDS = ["fact", "decision", "lesson", "preference"];

  // Persisted, because this user reloads the page all day and losing the
  // filter every time is its own small tax.
  var projectFilter = localStorage.getItem("dkm_project") || "";
  var knowsState = {
    q: "",
    kind: JSON.parse(localStorage.getItem("dkm_kinds") || "null") ||
      { fact: true, decision: true, lesson: true, preference: true }
  };
  var projectsCache = null;
  var totalMemories = 0;

  function withKinds(obj, kinds) {
    // URLSearchParams cannot express a repeated key from an object literal, so
    // the kinds are appended after construction.
    var p = new URLSearchParams(obj);
    kinds.forEach(function (k) { p.append("kind", k); });
    return p;
  }

  function projectList() {
    if (projectsCache) return Promise.resolve(projectsCache);
    return api("/v1/projects").then(function (d) {
      projectsCache = (d.projects || []).filter(function (p) { return p.project; });
      totalMemories = projectsCache.reduce(function (n, p) { return n + (p.memories || 0); }, 0);
      return projectsCache;
    }).catch(function () { return []; });
  }

  function shortProject(p) {
    return String(p).split("/").pop();
  }

  function projectSelect() {
    var opts = ['<option value="">All projects</option>'].concat(
      (projectsCache || []).map(function (p) {
        return '<option value="' + esc(p.project) + '"' +
          (p.project === projectFilter ? " selected" : "") + ">" +
          esc(shortProject(p.project)) + " (" + num(p.sessions) + " sessions)</option>";
      })).join("");
    return '<select id="pfilter">' + opts + "</select>";
  }

  function wireProjectSelect() {
    var sel = el("pfilter");
    if (!sel) return;
    sel.addEventListener("change", function () {
      projectFilter = sel.value;
      localStorage.setItem("dkm_project", projectFilter);
      show(tab);
    });
  }

  function currentProject() {
    return (projectsCache || []).filter(function (p) { return p.project === projectFilter; })[0];
  }

  function emptyKnows(projects) {
    var p = currentProject();
    if (p) {
      return '<div class="card"><h3>Nothing distilled for ' + esc(shortProject(p.project)) + " yet</h3><p>" +
        num(p.observations) + " observations are stored for it. Reading them costs tokens, " +
        "so it does not start on its own.</p></div>";
    }
    var obs = (projects || []).reduce(function (n, x) { return n + (x.observations || 0); }, 0);
    return '<div class="card"><h3>Nothing distilled yet</h3><p>' +
      num(obs) + " observations are stored. Reading them costs tokens, so it does not " +
      "start on its own.</p></div>";
  }

  function backlogFooter() {
    var p = currentProject();
    if (p && p.sessions > p.summarised) {
      return '<div class="stats"><span>Can\'t find it? ' + num(p.sessions - p.summarised) +
        " of " + esc(shortProject(p.project)) + "'s sessions are not read yet.</span></div>";
    }
    return "";
  }

  function wireKnows() {
    wireProjectSelect();
    var q = el("kq"), go = el("kgo");
    function run() { knowsState.q = q.value; show("knows"); }
    if (go) go.addEventListener("click", run);
    if (q) q.addEventListener("keydown", function (e) { if (e.key === "Enter") run(); });

    Array.prototype.forEach.call(document.querySelectorAll("[data-kind]"), function (b) {
      b.addEventListener("change", function () {
        knowsState.kind[b.dataset.kind] = b.checked;
        localStorage.setItem("dkm_kinds", JSON.stringify(knowsState.kind));
        show("knows");
      });
    });
    function setAll(v) {
      KINDS.forEach(function (k) { knowsState.kind[k] = v; });
      localStorage.setItem("dkm_kinds", JSON.stringify(knowsState.kind));
      show("knows");
    }
    if (el("kall")) el("kall").addEventListener("click", function () { setAll(true); });
    if (el("knone")) el("knone").addEventListener("click", function () { setAll(false); });
  }

  var COMPOSE_FOCUS = [
    { k: "flow", label: "flow" },
    { k: "structure", label: "structure" },
    { k: "coding", label: "coding" },
    { k: "ux", label: "UX / UI" },
    { k: "security", label: "security" }
  ];

  // Kept outside the render so a redraw does not eat what is being typed.
  var composeState = { task: "", project: "", target: "", focus: {}, result: null };

  function composeBody() {
    var body = { description: composeState.task, project: composeState.project };
    if (composeState.target) body.target = composeState.target;
    var em = COMPOSE_FOCUS.map(function (f) { return f.k; })
      .filter(function (k) { return composeState.focus[k]; });
    if (em.length) body.emphases = em;
    return body;
  }

  function readComposeInputs() {
    var t = el("cptask"), p = el("cpproj"), g = el("cptarget");
    if (t) composeState.task = t.value;
    if (p) composeState.project = p.value;
    if (g) composeState.target = g.value.trim();
    composeState.focus = {};
    Array.prototype.forEach.call(document.querySelectorAll(".chks input"), function (b) {
      if (b.checked) composeState.focus[b.value] = true;
    });
  }

  function wireCompose() {
    var out = el("cpout");
    if (composeState.result) out.innerHTML = composeState.result;

    var go = el("cpgo"), prev = el("cpprev"), status = el("cpstatus");

    function busy(on, msg) {
      if (go) go.disabled = on;
      if (prev) prev.disabled = on;
      status.textContent = on ? msg : "";
    }

    if (prev) {
      prev.addEventListener("click", function () {
        readComposeInputs();
        if (!composeState.task.trim()) { status.textContent = "say what you want to build"; return; }
        busy(true, "checking what is known…");
        api("/v1/prompt/preview", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(composeBody())
        }).then(function (res) {
          busy(false);
          var ms = res.memories || [];
          var html = '<div class="card"><h3>' +
            (ms.length ? num(ms.length) + " memories would ground this prompt"
                       : "Nothing in your corpus matches this yet") + "</h3>" +
            (ms.length
              ? '<div class="scroll"><table><thead><tr><th>Kind</th><th>Title</th><th>Score</th></tr></thead><tbody>' +
                ms.map(function (m) {
                  return '<tr><td><span class="tag ' + esc(m.kind) + '">' + esc(m.kind) +
                    "</span></td><td>" + esc(m.title) + "</td><td>" +
                    (m.score ? m.score.toFixed(3) : "—") + "</td></tr>";
                }).join("") + "</tbody></table></div>"
              : "<p>The prompt will still be written, but it will claim no conventions " +
                "about this project rather than invent any.</p>") +
            '<p style="margin-top:9px">Mode <code>' + esc(res.mode) + "</code> · about " +
            num(res.estimated_input_tokens) + " input tokens. Nothing was sent to the provider.</p></div>";
          composeState.result = html;
          out.innerHTML = html;
        }).catch(function (e) { busy(false); status.textContent = e.message; });
      });
    }

    if (go) {
      go.addEventListener("click", function () {
        readComposeInputs();
        if (!composeState.task.trim()) { status.textContent = "say what you want to build"; return; }
        busy(true, "composing — one call to your provider, usually under a minute…");
        api("/v1/prompt", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(composeBody())
        }).then(function (res) {
          busy(false);
          if (!res.generated) {
            out.innerHTML = '<div class="card"><h3>Not configured</h3><p>' +
              esc(res.reason || "") + "</p><p>" + esc(res.fix || "") + "</p></div>";
            return;
          }
          var ms = res.memories || [];
          var cost = res.cost || {};
          var html =
            (res.understood
              ? '<div class="card"><h3>Understood as</h3><p style="color:var(--accent)">' +
                esc(res.understood) + "</p>" +
                "<p>If that is not what you meant, edit the description and generate again — " +
                "it is cheaper to correct here than after the code is written.</p></div>"
              : "") +
            '<div class="card"><h3>Your prompt</h3>' +
            '<div class="row" style="margin-bottom:9px"><button id="cpcopy">Copy</button>' +
            '<span class="dim" style="align-self:center">paste this into ' +
            esc(composeState.target || "Claude") + "</span></div>" +
            '<pre id="cptext" class="promptbox">' + esc(res.prompt) + "</pre></div>" +
            (ms.length
              ? '<div class="card"><h3>Grounded in ' + num(ms.length) + " of your own memories</h3>" +
                "<p>These came from your sessions. If a constraint in the prompt looks wrong, " +
                "it traces back to one of them.</p><div class=\"meta\">" +
                ms.map(function (m) {
                  return '<span class="tag ' + esc(m.kind) + '">' + esc(m.title) + "</span>";
                }).join("") + "</div></div>"
              : '<div class="card"><h3>Grounded in nothing</h3><p>' +
                "No stored memory matched this task closely enough to use, so the prompt " +
                "claims no conventions rather than inventing any. Consolidating more " +
                "sessions will ground future prompts.</p></div>") +
            '<div class="stats"><span>' + esc(res.provider || "") + "</span><span>" +
            num(cost.input_tokens || 0) + " in / " + num(cost.output_tokens || 0) + " out" +
            (cost.includes_reasoning ? " (output includes model thinking)" : "") + "</span></div>";

          composeState.result = html;
          out.innerHTML = html;

          var copy = el("cpcopy");
          if (copy) {
            copy.addEventListener("click", function () {
              var text = el("cptext").textContent;
              // navigator.clipboard needs a secure context, which a plain
              // http://127.0.0.1 page is — but not http://<lan-ip>. Fall back
              // to selecting the text so the button is never simply dead.
              if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(function () {
                  copy.textContent = "Copied";
                  setTimeout(function () { copy.textContent = "Copy"; }, 1400);
                }).catch(function () { selectText(el("cptext")); copy.textContent = "Press Ctrl+C"; });
              } else {
                selectText(el("cptext"));
                copy.textContent = "Press Ctrl+C";
              }
            });
          }
        }).catch(function (e) { busy(false); status.textContent = e.message; });
      });
    }
  }

  function selectText(node) {
    var range = document.createRange();
    range.selectNodeContents(node);
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }

  // Path labels collide badly at project scale: the 300 heaviest files in one
  // project here share only 257 distinct basenames, with route.ts appearing 26
  // times. Walk up the path until the tail is unique among what is drawn.
  function labelFor(path, taken) {
    var parts = String(path).split(/[\/\\]/).filter(Boolean);
    for (var n = 1; n <= parts.length; n++) {
      var cand = parts.slice(parts.length - n).join("/");
      if (!taken[cand] || n === parts.length) { taken[cand] = true; return cand; }
    }
    return path;
  }

  function shortPath(p) {
    var parts = String(p).split(/[\/\\]/).filter(Boolean);
    return parts.length <= 2 ? p : parts.slice(-2).join("/");
  }

  function wireGraphControls(projects) {
    var sel = el("gproj");
    if (sel) {
      sel.addEventListener("change", function () {
        graphProject = sel.value;
        graphSeed = "";   // a focus from one project means nothing in another
        show("graph");
      });
    }
    var clear = el("gclear");
    if (clear) {
      clear.addEventListener("click", function () { graphSeed = ""; show("graph"); });
    }
    var btn = el("grebuild");
    if (btn) {
      btn.addEventListener("click", function () {
        btn.disabled = true;
        var started = Date.now();
        el("gstatus").textContent = "rebuilding…";
        // Read the result. Discarding it made a rebuild that produced nothing
        // indistinguishable from one that worked.
        api("/v1/graph/rebuild?" + new URLSearchParams({ project: graphProject }), { method: "POST" })
          .then(function (res) {
            var secs = ((Date.now() - started) / 1000).toFixed(1);
            el("gstatus").textContent = num(res.nodes) + " nodes, " + num(res.edges) +
              " edges in " + secs + "s";
            setTimeout(function () { show("graph"); }, 900);
          })
          .catch(function (e) { el("gstatus").textContent = e.message; btn.disabled = false; });
      });
    }
  }

  // A small force-directed layout, written out rather than pulled from a
  // library: the page runs under a CSP that forbids every external origin, and
  // a graph of a few hundred nodes does not need a physics engine.
  function drawGraph(g) {
    var svg = el("gsvg");
    if (!svg) return;

    var W = 900, H = 560;
    var nodes = g.nodes.map(function (n, i) {
      // Seeded on a circle rather than at random, so the same corpus lays out
      // the same way twice and the picture is comparable between visits.
      var a = (i / g.nodes.length) * Math.PI * 2;
      return {
        id: n.id, label: n.label, kind: n.kind, weight: n.weight || 1,
        x: W / 2 + Math.cos(a) * 200, y: H / 2 + Math.sin(a) * 180, vx: 0, vy: 0
      };
    });
    var index = {};
    nodes.forEach(function (n, i) { index[n.id] = i; });

    var links = (g.edges || []).filter(function (e) {
      return index[e.src] !== undefined && index[e.dst] !== undefined;
    }).map(function (e) {
      return { s: index[e.src], t: index[e.dst], w: e.weight || 1, rel: e.rel };
    });

    // Spring rest length scaled to the space each node actually has.
    //
    // A fixed 90px was tuned when a graph was twenty nodes. At three hundred it
    // asks for roughly five times the canvas that exists, so the layout pushes
    // everything outward and nearly half the nodes end up pinned against the
    // clamp walls in a ring. sqrt(area/n) is the spacing the box can honour.
    var rest = Math.max(26, Math.min(90, Math.sqrt((W * H) / Math.max(1, nodes.length))));
    var repel = 900 * (rest / 90);

    // Fixed iteration count, run before the first paint. Animating the
    // settling looks impressive and means the layout is different every time
    // you glance at it.
    for (var step = 0; step < 300; step++) {
      var k = 1 - step / 300;
      for (var i = 0; i < nodes.length; i++) {
        for (var j = i + 1; j < nodes.length; j++) {
          var a = nodes[i], b = nodes[j];
          var dx = b.x - a.x, dy = b.y - a.y;
          var d2 = dx * dx + dy * dy || 0.01;
          var f = repel / d2;
          var d = Math.sqrt(d2);
          var ux = dx / d, uy = dy / d;
          a.vx -= ux * f; a.vy -= uy * f;
          b.vx += ux * f; b.vy += uy * f;
        }
      }
      links.forEach(function (l) {
        var a = nodes[l.s], b = nodes[l.t];
        var dx = b.x - a.x, dy = b.y - a.y;
        var d = Math.sqrt(dx * dx + dy * dy) || 0.01;
        var f = (d - rest) * 0.02;
        var ux = dx / d, uy = dy / d;
        a.vx += ux * f; a.vy += uy * f;
        b.vx -= ux * f; b.vy -= uy * f;
      });
      nodes.forEach(function (n) {
        n.vx += (W / 2 - n.x) * 0.002;
        n.vy += (H / 2 - n.y) * 0.002;
        n.x += n.vx * k; n.y += n.vy * k;
        n.vx *= 0.85; n.vy *= 0.85;
        n.x = Math.max(30, Math.min(W - 30, n.x));
        n.y = Math.max(24, Math.min(H - 24, n.y));
      });
    }

    var maxW = links.reduce(function (m, l) { return Math.max(m, l.w); }, 1);
    // Edge alpha scaled by density. Constants tuned when a graph was twenty
    // nodes make 3,657 links a grey wash on the biggest project -- the one with
    // the most to show ends up the least readable.
    var density = links.length / Math.max(1, nodes.length);
    var alphaScale = Math.min(1, 4 / Math.max(1, density));

    var parts = [];
    links.forEach(function (l, li) {
      var a = nodes[l.s], b = nodes[l.t];
      parts.push('<line data-l="' + li + '" x1="' + a.x.toFixed(1) + '" y1="' + a.y.toFixed(1) +
        '" x2="' + b.x.toFixed(1) + '" y2="' + b.y.toFixed(1) +
        '" stroke="currentColor" stroke-opacity="' +
        ((0.15 + 0.5 * (l.w / maxW)) * alphaScale).toFixed(3) +
        '" stroke-width="' + (0.6 + 2.4 * (l.w / maxW)).toFixed(2) + '" />');
    });
    // Label only the heaviest few. Three hundred labels at this scale overlap
    // into an unreadable smear; the rest carry their full path in a tooltip.
    var byWeight = nodes.slice().sort(function (a, b) { return b.weight - a.weight; });
    var labelled = {};
    var taken = {};
    byWeight.slice(0, nodes.length > 60 ? 25 : nodes.length).forEach(function (n) {
      if (n.kind === "file") labelled[n.id] = labelFor(n.label, taken);
    });

    var groups = folderGroups(nodes);

    nodes.forEach(function (n, i) {
      var r = n.kind === "file" ? 5 + Math.min(9, Math.sqrt(n.weight) * 2) : 4;
      var text = labelled[n.id];
      if (text && text.length > 26) text = "…" + text.slice(text.length - 25);
      parts.push('<g class="gn" data-i="' + i + '" data-label="' + esc(n.label) +
        '" data-kind="' + esc(n.kind) + '" data-g="' + (n.group == null ? "" : n.group) + '">' +
        '<circle cx="' + n.x.toFixed(1) + '" cy="' + n.y.toFixed(1) + '" r="' + r.toFixed(1) +
        '" fill="' + (n.kind === "file" ? groupColour(n.group) : "var(--muted)") +
        '"><title>' + esc(n.label + "  (" + n.weight + ")") + "</title></circle>" +
        (text
          ? '<text x="' + n.x.toFixed(1) + '" y="' + (n.y - r - 4).toFixed(1) +
            '" text-anchor="middle" class="gt">' + esc(text) + "</text>"
          : "") +
        "</g>");
    });

    svg.innerHTML = parts.join("");
    renderLegend(groups, nodes);

    // Adjacency, built once, so selecting a file is a DOM opacity pass rather
    // than a refetch and a fresh 300-iteration layout. Re-running the physics
    // on click moved the whole picture under the cursor and lost the node the
    // user had just decided to look at.
    var adj = {};
    links.forEach(function (l) {
      (adj[l.s] = adj[l.s] || []).push({ i: l.t, w: l.w });
      (adj[l.t] = adj[l.t] || []).push({ i: l.s, w: l.w });
    });

    var groupEls = svg.querySelectorAll("g.gn");
    var lineEls = svg.querySelectorAll("line");

    function highlight(keep) {
      // keep === null restores everything.
      for (var i = 0; i < groupEls.length; i++) {
        groupEls[i].style.opacity = (!keep || keep[i]) ? "1" : "0.10";
      }
      for (var j = 0; j < lineEls.length; j++) {
        var l = links[+lineEls[j].dataset.l];
        lineEls[j].style.opacity = (!keep || (keep[l.s] && keep[l.t])) ? "1" : "0.04";
      }
    }
    graphHighlight = highlight;

    function selectNode(i) {
      var n = nodes[i];
      var nbrs = (adj[i] || []).slice().sort(function (a, b) { return b.w - a.w; });

      var keep = {};
      keep[i] = true;
      nbrs.forEach(function (x) { keep[x.i] = true; });
      highlight(keep);

      var rows = nbrs.slice(0, 12).map(function (x) {
        return '<tr><td><a href="#" class="nbr" data-i="' + x.i + '">' +
          esc(shortPath(nodes[x.i].label)) + "</a></td><td>" + num(x.w) + "</td></tr>";
      }).join("");

      el("gdetail").innerHTML =
        "<h3>" + esc(shortPath(n.label)) + "</h3>" +
        '<p class="dim" style="overflow-wrap:anywhere">' + esc(n.label) + "</p>" +
        (nbrs.length
          ? "<p>You change this at the same time as <b>" + num(nbrs.length) + "</b> other files.</p>" +
            '<div class="scroll"><table><thead><tr><th>Files you change at the same time</th><th></th></tr></thead><tbody>' +
            rows + "</tbody></table></div>" +
            (nbrs.length > 12 ? '<p class="dim">…and ' + num(nbrs.length - 12) + " more</p>" : "") +
            '<div class="row" style="margin-top:10px">' +
            '<button id="gonly">Show only these</button><button id="gclr">Clear</button></div>' +
            '<p class="dim" style="margin-top:7px">"Show only these" redraws the map with just ' +
            "this file and the files linked to it.</p>"
          : "<p>You have never changed this file at the same time as another file.</p>");

      Array.prototype.forEach.call(el("gdetail").querySelectorAll("a.nbr"), function (a) {
        a.addEventListener("click", function (ev) { ev.preventDefault(); selectNode(+a.dataset.i); });
      });
      if (el("gonly")) el("gonly").addEventListener("click", function () {
        graphSeed = n.label; graphDepth = 1; show("graph");
      });
      if (el("gclr")) el("gclr").addEventListener("click", clearSelection);
    }

    function clearSelection() {
      highlight(null);
      el("gdetail").innerHTML = '<p class="dim">Click a file to see what you change at the same time.</p>';
    }

    svg.addEventListener("click", function (ev) {
      var grp = ev.target.closest ? ev.target.closest("g.gn") : null;
      if (!grp) { clearSelection(); return; }
      if (grp.dataset.kind !== "file") return;
      selectNode(+grp.dataset.i);
    });
  }

  // --- folders as colour ----------------------------------------------------

  // Grouped by folder, not by community detection. Louvain would spend ~150
  // lines rediscovering a structure the paths already state outright, and name
  // its clusters worse than the directory does.
  var GROUP_COLOURS = [
    "#5ac8a8", "#7aa2f7", "#e0af68", "#bb9af7", "#f7768e",
    "#7dcfff", "#9ece6a", "#ff9e64", "#c0caf5"
  ];

  function groupColour(g) {
    if (g == null) return "var(--muted)";
    return GROUP_COLOURS[g % GROUP_COLOURS.length];
  }

  function folderDir(path) {
    var parts = String(path).split(/[\/\\]/).filter(Boolean);
    if (parts.length <= 1) return "(root)";
    return parts.slice(0, Math.min(2, parts.length - 1)).join("/");
  }

  // Assigns n.group in place and returns the ordered groups.
  //
  // Only file nodes. A memory node's label is a ULID with no path separator,
  // so it would land in a bogus group and could end up naming one.
  function folderGroups(nodes) {
    var counts = {};
    nodes.forEach(function (n) {
      if (n.kind !== "file") return;
      var d = folderDir(n.label);
      counts[d] = (counts[d] || 0) + 1;
    });

    var ordered = Object.keys(counts).sort(function (a, b) { return counts[b] - counts[a]; });
    var top = ordered.slice(0, GROUP_COLOURS.length - 1);
    var index = {};
    top.forEach(function (d, i) { index[d] = i; });

    var otherCount = 0;
    nodes.forEach(function (n) {
      if (n.kind !== "file") { n.group = null; return; }
      var d = folderDir(n.label);
      if (index[d] === undefined) { n.group = GROUP_COLOURS.length - 1; otherCount++; }
      else n.group = index[d];
    });

    var out = top.map(function (d, i) { return { name: d, count: counts[d], g: i }; });
    if (otherCount) {
      out.push({ name: "everything else", count: otherCount, g: GROUP_COLOURS.length - 1, other: true });
    }
    return out;
  }

  var graphHighlight = null;
  var legendActive = null;

  function renderLegend(groups, nodes) {
    var box = el("glegend");
    if (!box) return;
    var mem = nodes.filter(function (n) { return n.kind !== "file"; }).length;

    box.innerHTML = '<div class="card"><h3>Folders in this project</h3><div class="legend">' +
      groups.map(function (gr) {
        return '<button class="lg" data-g="' + gr.g + '"' +
          (gr.other ? ' title="' + num(gr.count) + ' files in folders too small to colour separately."' : "") +
          '><span class="gk" style="background:' + groupColour(gr.g) + '"></span>' +
          esc(gr.name) + ' <span class="dim">' + num(gr.count) + "</span></button>";
      }).join("") +
      (mem ? '<span class="lg"><span class="gk" style="background:var(--muted)"></span>memory <span class="dim">' +
        num(mem) + "</span></span>" : "") +
      '</div><p class="dim" style="margin-top:8px">Click a folder to see only its files. ' +
      "Click it again to bring the rest back.</p></div>";

    Array.prototype.forEach.call(box.querySelectorAll("button.lg"), function (b) {
      b.addEventListener("click", function () {
        var g = +b.dataset.g;
        if (!graphHighlight) return;
        if (legendActive === g) { legendActive = null; graphHighlight(null); }
        else {
          legendActive = g;
          var keep = {};
          nodes.forEach(function (n, i) { if (n.group === g) keep[i] = true; });
          graphHighlight(keep);
        }
        Array.prototype.forEach.call(box.querySelectorAll("button.lg"), function (x) {
          x.classList.toggle("on", legendActive !== null && +x.dataset.g === legendActive);
        });
      });
    });
  }

  function show(name) {
    if (!views[name]) name = "projects";
    tab = name;
    // Persisted, because this user reloads all day and being dropped back on
    // the landing tab every time is a small tax paid dozens of times.
    localStorage.setItem("dkm_tab", name);
    Array.prototype.forEach.call(document.querySelectorAll("nav button"), function (b) {
      b.setAttribute("aria-selected", String(b.dataset.tab === name));
    });
    showError(null);
    render("");
    views[name]().catch(showError);
  }

  // Tabs that must not be redrawn by a background event.
  //
  // Redrawing the graph re-runs the force layout, so the picture moves under
  // the cursor and any selection is lost. Redrawing Compose erases the
  // description mid-sentence: one agent saving one memory would wipe it.
  var noAutoRefresh = { graph: true, compose: true };

  function connectEvents() {
    if (es) es.close();
    // EventSource cannot set an Authorization header, so the stream is opened
    // by a fetch that reads the body incrementally. Same endpoint, same auth.
    var ctrl = new AbortController();
    fetch(base + "/v1/events", {
      headers: { "Authorization": "Bearer " + key },
      signal: ctrl.signal
    }).then(function (r) {
      if (!r.ok || !r.body) throw new Error("event stream unavailable");
      el("dot").className = "dot live";
      el("livetext").textContent = "live";

      var reader = r.body.getReader(), dec = new TextDecoder(), buf = "";
      function pump() {
        return reader.read().then(function (res) {
          if (res.done) throw new Error("stream ended");
          buf += dec.decode(res.value, { stream: true });
          var parts = buf.split("\n\n");
          buf = parts.pop();
          parts.forEach(function (frame) {
            if (frame.indexOf("event:") === -1) return;
            // Any change refreshes the current view. The payload is not trusted
            // to patch the DOM; it only signals that a refetch is worthwhile.
            //
            // Debounced: an import or a drain emits events far faster than a
            // person reads, and refetching per frame makes the page thrash.
            scheduleRefresh();
          });
          return pump();
        });
      }
      return pump();
    }).catch(function () {
      el("dot").className = "dot down";
      // "reconnecting" reads as an error when the usual cause is that dkm was
      // restarted deliberately.
      el("livetext").textContent = "not connected — retrying";
      setTimeout(connectEvents, 4000);
    });
    es = { close: function () { ctrl.abort(); } };
  }

  var refreshTimer = null;
  function scheduleRefresh() {
    if (refreshTimer) return;
    refreshTimer = setTimeout(function () {
      refreshTimer = null;
      if (views[tab] && !noAutoRefresh[tab]) views[tab]().catch(function () {});
      loadStats();
    }, 800);
  }

  function start() {
    el("gate").hidden = true;
    el("app").hidden = false;
    loadStats();
    show(localStorage.getItem("dkm_tab") || "projects");
    connectEvents();
  }

  Array.prototype.forEach.call(document.querySelectorAll("nav button"), function (b) {
    b.addEventListener("click", function () { show(b.dataset.tab); });
  });

  el("connect").addEventListener("click", function () {
    key = el("key").value.trim();
    if (!key) { gateError("Paste the key first."); return; }
    api("/v1/healthz").then(function () {
      sessionStorage.setItem("dkm_key", key);
      gateError("");
      start();
    }).catch(function (e) {
      el("gate").hidden = false;
      el("app").hidden = true;
      // Inline, and the three cases told apart. An alert() box says the same
      // thing for a typo, a dead server and a key that works but cannot do
      // what was asked -- three different fixes.
      var m = String(e.message || "");
      if (/401|403|unauthor|forbidden|invalid/i.test(m)) {
        gateError("Key refused. Check you copied the whole line, including pmk_.");
      } else if (/fetch|network|unreachable|failed/i.test(m)) {
        gateError("Cannot reach the server at " + location.origin + ". Is dkm serve still running?");
      } else {
        gateError(m);
      }
    });
  });

  function gateError(msg) {
    var box = el("gateerr");
    if (!box) return;
    box.textContent = msg;
    box.hidden = !msg;
  }

  if (el("keycopy")) {
    el("keycopy").addEventListener("click", function () {
      var t = el("keycmd").textContent;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(t).then(function () {
          el("keycopy").textContent = "Copied";
          setTimeout(function () { el("keycopy").textContent = "Copy"; }, 1400);
        }).catch(function () { selectText(el("keycmd")); });
      } else {
        selectText(el("keycmd"));
      }
    });
  }
  el("key").addEventListener("keydown", function (e) {
    if (e.key === "Enter") el("connect").click();
  });

  if (key) {
    api("/v1/healthz").then(start).catch(function () {
      sessionStorage.removeItem("dkm_key");
      key = "";
      el("gate").hidden = false;
    });
  } else {
    el("gate").hidden = false;
  }
})();
</script>
</body>
</html>
